<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ school }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('register') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="logo"><span>{{ school }}</span></a>
  <nav>
    {% if me %}
      <span class="who">{{ me['name'] }} ({{ me['role'] }})</span>
      <a href="{{ url_for({'teacher':'teacher_dash','student':'student_dash','admin':'admin_dash'}[me['role']]) }}">Dashboard</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    {% else %}
      <a href="{{ url_for('register') }}">Register</a>
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('admin_login') }}">Admin</a>
    {% endif %}
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
